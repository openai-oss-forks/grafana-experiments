name: PR automation
on:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
permissions: {}
concurrency:
  group: pr-commands-${{ github.event.number }}
jobs:
  main:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Run Commands
        uses: grafana/grafana-github-actions/commands@26e65a1da9ffdf35d3e8cc6dbeffbccf16022d88 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configPath: pr-commands
